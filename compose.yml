version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - minio
      - db
    environment:
      - DATABASE_URL=postgresql://labelstudio:password123@db:5432/labelstudio_data
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
      - REDIS_URL=redis://redis:6379/0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  trainer-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: ai-trainer-worker
    restart: unless-stopped
    depends_on:
      - redis
      - minio
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
      - REDIS_URL=redis://redis:6379/0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  db:
    image: postgres:15
    container_name: label-studio-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=labelstudio
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=labelstudio_data
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=labelstudio_data
      - POSTGRE_USER=labelstudio
      - POSTGRE_PASSWORD=password123
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
    volumes:
      - label-studio-data:/label-studio/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  minio:
    image: minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # MinIO S3 API Port
      - "9001:9001"   # MinIO Web Console Port
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

volumes:
  redis-data:
  postgresql-data:
  label-studio-data:
  minio-data: